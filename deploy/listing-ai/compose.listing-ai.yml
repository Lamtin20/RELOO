# Sidecars only. Use render_app_overlay.py for app settings so existing networks
# (identity/OCR/SSO/Agent/frontend) are preserved. Never replace app network lists.
services:
  product-ai:
    image: ${RELOO_PRODUCT_AI_IMAGE:?pin audited Ollama image digest}
    environment:
      RELOO_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: -1m
    volumes:
      - reloo-product-ai-models:/root/.ollama
    networks:
      product-ai:
        aliases: [product-ai]
    mem_limit: 7g
    cpus: 4
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m]
    restart: unless-stopped
  product-research:
    image: ${RELOO_PRODUCT_RESEARCH_IMAGE:?pin reviewed research image digest}
    environment:
      RELOO_PRODUCT_RESEARCH_TOKEN: ${RELOO_PRODUCT_RESEARCH_TOKEN:?server-only token required}
    networks: [product-research,product-research-egress]
    mem_limit: 384m
    cpus: 1
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,uid=1000,gid=1000"]
    restart: unless-stopped
networks:
  product-ai:
    name: reloo-product-ai-private
    external: true
  product-research:
    name: reloo-product-research-private
    external: true
  product-research-egress:
    name: reloo-product-research-egress
    external: true
volumes:
  reloo-product-ai-models:
    external: true
