name: reloo-identity-bridge
services:
 bridge:
  image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
  container_name: reloo-identity-bridge
  user: '101:101'
  entrypoint: ['nginx', '-g', 'daemon off;']
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 64m
  cpus: 0.5
  tmpfs: ['/tmp:rw,nosuid,nodev,size=16m,mode=1777']
  dns: [1.1.1.1, 1.0.0.1]
  volumes:
   - ./identity-bridge.conf:/etc/nginx/nginx.conf:ro
  networks:
   backend:
    aliases: [reloo-identity-bridge]
   egress: {}
networks:
 backend:
  external: true
  name: reloo-staging-backend
 egress:
  name: reloo-first-party-egress
  internal: false
