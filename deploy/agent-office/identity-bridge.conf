worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
 access_log off;
 server_tokens off;
 resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;
 proxy_connect_timeout 5s;
 proxy_read_timeout 8s;
 proxy_ssl_server_name on;
 proxy_ssl_verify on;
 proxy_ssl_verify_depth 4;
 proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
 proxy_pass_request_headers off;
 client_body_temp_path /tmp/client-body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  client_max_body_size 2k;
  location = /ready { return 200 'RELOO_FIRST_PARTY_BRIDGE_READY'; }
  location ~ ^/api/auth/federation/(exchange|introspect|revoke)$ {
   limit_except POST { deny all; }
   proxy_set_header Host crm.reloo.vn;
   proxy_set_header Content-Type application/json;
   proxy_set_header Authorization $http_authorization;
   proxy_ssl_name crm.reloo.vn;
   proxy_pass https://crm.reloo.vn$uri;
  }
  location = /health/production {
   limit_except GET { deny all; }
   proxy_pass_request_body off;
   proxy_set_header Content-Length '';
   proxy_set_header Host reloo.vn;
   proxy_ssl_name reloo.vn;
   set $production_health_host reloo.vn;
   proxy_pass https://$production_health_host/api/health;
  }
  location = /health/staging {
   limit_except GET { deny all; }
   proxy_pass_request_body off;
   proxy_set_header Content-Length '';
   proxy_set_header Host staging.reloo.vn;
   proxy_ssl_name staging.reloo.vn;
   set $staging_health_host staging.reloo.vn;
   proxy_pass https://$staging_health_host/api/health;
  }
  location / { return 403; }
 }
}
