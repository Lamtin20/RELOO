name: reloo-staging
services:
  edge:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:4525:8080'
      - '127.0.0.1:4526:8081'
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UAT_SECRETS_DIR:?}/htpasswd:/run/uat/htpasswd:ro
    networks: [staging]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ['/var/cache/nginx:size=32m','/var/run:size=4m','/tmp:size=16m']
    mem_limit: 128m
    pids_limit: 128
networks:
  staging:
    external: true
    name: reloo-staging-backend
