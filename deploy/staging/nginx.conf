# Behind the existing TLS edge. TLS certificate provisioning is NOT completed by this file.
# Protect every path, including static files, robots and health, at the edge.
server {
 listen 127.0.0.1:4525;
 server_name staging.reloo.vn;
 auth_basic "RELOO staging";
 auth_basic_user_file /etc/reloo-staging/htpasswd;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 client_max_body_size 8m;
 location / {
  proxy_pass http://127.0.0.1:4524;
  proxy_set_header Host staging.reloo.vn;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_http_version 1.1;
 }
}
