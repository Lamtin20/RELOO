map $http_upgrade $uat_upgrade { default upgrade; '' close; }
server {
 listen 8080;
 server_name staging.reloo.vn;
 access_log off;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 client_max_body_size 8m;
 location / {
  proxy_pass http://app:3000;
  proxy_set_header Host staging.reloo.vn;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $uat_upgrade;
  proxy_http_version 1.1;
 # Authenticated SSR can include refreshed HttpOnly cookies plus nonce CSP.
 # Bound response buffering instead of dropping security/session headers.
 proxy_buffer_size 32k;
 proxy_buffers 8 32k;
 proxy_busy_buffers_size 64k;
 }
}
server {
 listen 8080;
 server_name chat.reloo.vn;
 access_log off;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 client_max_body_size 128k;
 location / {
  proxy_pass http://app:3000;
  proxy_set_header Host chat.reloo.vn;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Authorization $http_authorization;
  proxy_http_version 1.1;
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
 }
}
server {
 listen 8081;
 server_name staging-auth.reloo.vn;
 access_log off;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 # Auth uses its own Bearer/session protocol. Do not replace it with Basic auth.
 # Server-only auth proxy is used by the UAT application; public browser auth
 # endpoints stay closed until an explicit OAuth UAT contract is configured.
 location / { return 403; }
}
